name: WeChat 8.0.78 Zygisk

on:
  push:
    branches: [wechat-8078]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Perl ZIP module
        run: sudo apt-get update && sudo apt-get install -y libarchive-zip-perl
      - name: Build WeChat APK resource
        run: ./gradlew :app:assembleRelease
      - name: Package Zygisk module
        run: cd module && bash ./build.sh :module:assembleRelease ./src/gradle/wechat.gradle Zygisk
      - name: Check installable ZIP metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          files = list(Path('module/build/release').glob('zygisk-module-xfingerprint-pay-wechat-*.zip'))
          assert len(files) == 1, files
          with ZipFile(files[0]) as z:
              prop = z.read('module.prop').decode()
              assert 'id=zygisk-module-xfingerprint-pay-wechat' in prop, prop
              assert 'versionCode=38' in prop, prop
              assert 'version=v6.1.0-8078' in prop, prop
              assert 'zygisk/arm64-v8a.so' not in z.namelist()  # installer extracts from lib/
              import hashlib
              for abi in ('armeabi-v7a', 'arm64-v8a'):
                  lib = f'lib/{abi}/libzygisk-module-xfingerprint-pay-wechat.so'
                  data = z.read(lib)
                  assert data.startswith(b'\x7fELF'), lib
                  assert b'WxaLiteAppPayTransparentLiteUI' in data, '8.0.78 hook missing'
                  assert b'com/surcumference/fingerprint/plugin/magisk/WeChat' in data, 'entry missing'
              for name in z.namelist():
                  if name.endswith('.sha256sum'):
                      target = name[:-10]
                      assert hashlib.sha256(z.read(target)).hexdigest() == z.read(name).decode().strip(), target
              for required in ('customize.sh', 'verify.sh', 'META-INF/com/google/android/update-binary'):
                  assert required in z.namelist(), required
          print(files[0])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: FingerprintPay-WeChat-8078-Zygisk
          path: module/build/release/zygisk-module-xfingerprint-pay-wechat-*.zip
